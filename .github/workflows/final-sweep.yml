name: Final identity sweep

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update CSS header comment
        run: |
          sed -i 's/Design tokens — nishanspace  (dark-first editorial)/Design tokens (dark-first)/' app/globals.css || true
          python3 - << 'EOF'
          import io
          p = 'app/globals.css'
          s = io.open(p, encoding='utf-8').read()
          s = s.replace('Design tokens — nishanspace  (dark-first editorial)', 'Design tokens (dark-first)')
          io.open(p, 'w', encoding='utf-8').write(s)
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: neutral CSS header comment"
          git push
