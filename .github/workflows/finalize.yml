name: Finalize redesign

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove superseded files and regenerate lockfile
        run: |
          rm -f components/HeroScene.tsx
          rm -rf .claude
          npm install --package-lock-only --ignore-scripts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: finalize redesign — remove HeroScene/three and dev config, regen lockfile"
          git push
