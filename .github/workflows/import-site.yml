name: Import full site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: nishansinghkaler786-byte/nishanspace
          ref: main
          path: _base

      - name: Overlay base site under redesign files
        run: |
          rsync -a --exclude '.git' --ignore-existing _base/ ./
          rm -rf _base
          cat cbx-append.css >> app/globals.css
          rm cbx-append.css

      - name: Regenerate lockfile with three.js deps
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit assembled site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble full site: nishanspace base + redesign overlay"
          git push
