name: Purge internal references

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix lockfile name and drop dev config
        run: |
          sed -i 's/"name": "nishan-space"/"name": "simranjeet-portfolio"/g' package-lock.json
          rm -rf .claude
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: purge internal references (lockfile name, dev config)"
          git push
